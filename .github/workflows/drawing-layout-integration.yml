name: Drawing layout integration
on:
  push:
    branches: [feature/drawing-layout-contract]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'flyfish-dev/hucre'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/drawing-layout-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build dependencies without changing the lockfile
        run: npm install --ignore-scripts --package-lock=false
      - name: Format only the reviewed changed files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node_modules/.bin/oxfmt src/_types.ts src/sheet-ops.ts src/xlsx/reader.ts src/xlsx/styles.ts src/xlsx/drawing-writer.ts src/xlsx/drawing-layout.ts scripts/verify-drawing-layout.mjs docs/drawing-layout.md package.json
          git add src/_types.ts src/sheet-ops.ts src/xlsx/reader.ts src/xlsx/styles.ts src/xlsx/drawing-writer.ts src/xlsx/drawing-layout.ts scripts/verify-drawing-layout.mjs docs/drawing-layout.md package.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format drawing contract changes with repository conventions'
            git push origin HEAD:refs/heads/feature/drawing-layout-contract
          fi
      - name: Check public parser and writer contract
        run: npm run test:drawing-layout
      - name: Type check
        run: npm run typecheck
      - name: Full library regression suite
        run: node_modules/.bin/vitest run
      - name: Collect exact source and built runtime for integration checks
        if: always()
        run: |
          git rev-parse HEAD > integration-revision.txt
          tar -czf drawing-layout-runtime.tar.gz src dist scripts docs package.json build.config.ts tsconfig.json tsconfig.cli.json integration-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawing-layout-runtime
          path: drawing-layout-runtime.tar.gz
          retention-days: 3
