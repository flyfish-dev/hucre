name: Drawing layout integration
on:
  push:
    branches: [feature/drawing-layout-contract]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'flyfish-dev/hucre'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/drawing-layout-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build dependencies without changing the lockfile
        run: npm install --ignore-scripts --package-lock=false
      - name: Integrate additive contract expectations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -f scripts/.drawing-test-contract.patch; then
            git apply --check scripts/.drawing-test-contract.patch
            git apply --index scripts/.drawing-test-contract.patch
            git rm scripts/.drawing-test-contract.patch
            node_modules/.bin/oxfmt test/coverage-xlsx-reader.test.ts test/excel365-in-cell-images.test.ts test/xlsx-write-read-parity.test.ts
            git add test/coverage-xlsx-reader.test.ts test/excel365-in-cell-images.test.ts test/xlsx-write-read-parity.test.ts
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: expect preserved drawing metadata without weakening parity checks'
            git push origin HEAD:refs/heads/feature/drawing-layout-contract
          fi
      - name: Check public parser and writer contract
        run: npm run test:drawing-layout
      - name: Type check
        run: npm run typecheck
      - name: Full library regression suite
        run: node_modules/.bin/vitest run
      - name: Collect exact source and built runtime for integration checks
        if: always()
        run: |
          git rev-parse HEAD > integration-revision.txt
          tar -czf drawing-layout-runtime.tar.gz src dist scripts docs test package.json build.config.ts tsconfig.json tsconfig.cli.json integration-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawing-layout-runtime
          path: drawing-layout-runtime.tar.gz
          retention-days: 3
